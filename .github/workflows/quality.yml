name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatter and linter
        run: python -m pip install --disable-pip-version-check ruff
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Syntax check
        run: python -m compileall -q signal_before_code scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository contract
        run: python scripts/validate_repo.py
